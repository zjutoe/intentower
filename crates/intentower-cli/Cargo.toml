[package]
name = "intentower-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Intentower command line interface (Phase 1 skeleton)"

[[bin]]
name = "intentower"
path = "src/main.rs"

[dependencies]
clap = "4"
serde_json = "1"
# Proof obligations come from Rossi, never from hand-written XML parsing.
rossi = "0.2.3"
rossi-prove = "0.2.3"
